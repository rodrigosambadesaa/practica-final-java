name: garaje

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: garaje
      MYSQL_USER: garaje
      MYSQL_PASSWORD: ${DB_PASSWORD:-garaje}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-garaje}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/garaje?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: garaje
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-garaje}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  classic:
    profiles: ["classic"]
    build:
      context: .
      dockerfile: Dockerfile.classic
    stdin_open: true
    tty: true
    volumes:
      - classic-data:/data

volumes:
  mysql-data:
  classic-data:

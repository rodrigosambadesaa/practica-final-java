name: Full stack tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classic:
    name: Java 21 classic model and console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile all classic sources and tests
        run: |
          mkdir -p /tmp/garaje-classes
          find src classic-tests -name '*.java' -print > /tmp/garaje-sources.txt
          javac -encoding UTF-8 -Xlint:all -d /tmp/garaje-classes @/tmp/garaje-sources.txt
      - name: Run classic regression suite
        run: |
          java -ea -cp /tmp/garaje-classes garaje.ModeloGarajeTest
          java -ea -cp /tmp/garaje-classes garaje.ModeloGarajeRegresionTest
      - name: Smoke test console exit and persistence
        run: |
          cd "$(mktemp -d)"
          printf '7\n' | java -cp /tmp/garaje-classes garaje.AplicacionGestionGaraje --consola
          test -s garaje.bin
          test -s contador.bin
      - name: Smoke test noninteractive EOF does not loop forever
        run: |
          cd "$(mktemp -d)"
          timeout 10s java -cp /tmp/garaje-classes garaje.AplicacionGestionGaraje --consola < /dev/null
          test -s garaje.bin
          test -s contador.bin

  backend:
    name: Spring Boot API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify API unit and HTTP integration tests
        run: mvn -B --no-transfer-progress -f backend/pom.xml clean verify

  frontend:
    name: Angular typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Angular component and HTTP client tests
        run: npm test
        working-directory: frontend
      - name: Build production frontend and typecheck
        run: npm run build
        working-directory: frontend

  docker-smoke:
    name: Docker Compose + MySQL end-to-end smoke
    needs: [classic, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ADMIN_TOKEN: ci-only-test-credential-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start MySQL, backend and frontend
        run: docker compose up --build -d
      - name: Smoke test HTTP frontend and database-backed API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 15 --retry-connrefused --retry-delay 3 http://localhost:4200/healthz
          curl -fsS --retry 15 --retry-connrefused --retry-delay 3 http://localhost:8080/actuator/health | grep -q '"UP"'
          response="$(curl -fsS -X POST http://localhost:8080/api/trabajos \
            -H 'Content-Type: application/json' \
            -d '{"tipo":"REVISION","descripcion":"Smoke test CI"}')"
          printf '%s\n' "$response" | grep -q '"precio":20'
          curl -fsS http://localhost:8080/api/trabajos | grep -q 'Smoke test CI'
          # El borrado y la carga deben rechazarse sin autorizacion.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/db/reset)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/db/seed)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/db/reset -H 'X-Admin-Token: incorrecta')" = 403
          # El administrador puede vaciar y volver a cargar los ejemplos.
          curl -fsS -X POST -H "X-Admin-Token: $APP_ADMIN_TOKEN" http://localhost:8080/api/db/reset | grep -q 'BBDD reseteada'
          test "$(curl -fsS http://localhost:8080/api/trabajos)" = '[]'
          curl -fsS -X POST -H "X-Admin-Token: $APP_ADMIN_TOKEN" http://localhost:8080/api/db/seed | grep -q 'Datos de ejemplo cargados'
          curl -fsS http://localhost:8080/api/trabajos | grep -q 'Cambio de embrague'
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Clean up containers and test data
        if: always()
        run: docker compose down --volumes --remove-orphans
